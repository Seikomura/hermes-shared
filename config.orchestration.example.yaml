# ============================================================
# config.orchestration.example.yaml — Fallback chain แบบ agent orchestration (14 ระดับ)
#
# ต้นฉบับ: เครื่องบ้าน (AI FACTORY) — 15 ส.ค. 2026
# แชร์ให้เครื่องทำงานใช้ผ่าน repo hermes-shared (ดู README.md หัวข้อ "🎯 Fallback chain orchestration")
#
# ⚠️⚠️⚠️ ไฟล์นี้เป็น TEMPLATE — ไม่มี secret ใดๆ (API key ทั้งหมดอยู่ใน .env ของแต่ละเครื่อง)
# ⚠️ ห้าม push config.yaml จริงขึ้น git (มีข้อมูลต่อเครื่อง) — คัดลอก template นี้ไปปรับที่เครื่องเอง
#
# วิธีใช้ที่เครื่องทำงาน (office):
#   1) สำรอง config เดิม:
#        copy C:\AI Factory\config.yaml  C:\AI Factory\config.yaml.bak-<วันที่>
#   2) คัดลอก template นี้ไปทับ:
#        copy config.orchestration.example.yaml  C:\AI Factory\config.yaml
#   3) ปรับชั้น LM Studio ท้ายสุด (⑬⑭) + custom_providers ให้เป็นของเครื่องตัวเอง
#      (เครื่องทำงาน: qwen/qwen3.5-9b @ 127.0.0.1:1234 = LM Studio ของตัวเอง — ดูคอมเมนต์ข้างล่าง)
#   4) รีสตาร์ท gateway ผ่าน task ของเครื่อง
#   5) ตรวจ:  hermes fallback list  +  python scripts\model-health-check.py  (ควรเห็น 8/8 OK)
# ============================================================

model:
  # OpenRouter ฟรี — ตัวหลัก (Nemotron 3 Ultra, 550B, 1M context — จุดเด่น: agent orchestration)
  provider: openrouter
  default: nvidia/nemotron-3-ultra-550b-a55b:free

fallback_providers:
  # OpenRouter ฟรี — Nemotron 3.5 Lightning (1M context, reasoning, รุ่นใหม่สุด)
  - provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
  # OpenRouter ฟรี — Poolside Laguna S 2.1 (agentic coding, Terminal-Bench 70.2%)
  - provider: openrouter
    model: poolside/laguna-s-2.1:free
  # OpenRouter ฟรี — Nemotron 3 Super (MTP, accuracy สูง AIME/SWE-Bench)
  - provider: openrouter
    model: nvidia/nemotron-3-super-120b-a12b:free
  # OpenRouter ฟรี — Cohere North Mini Code (JSON schema tool use)
  - provider: openrouter
    model: cohere/north-mini-code:free
  # OpenRouter ฟรี — gpt-oss-20b (function calling, structured outputs)
  - provider: openrouter
    model: openai/gpt-oss-20b:free
  # OpenRouter ฟรี — Nemotron 3 Nano Omni (multimodal text/image/video/audio)
  - provider: openrouter
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
  # OpenRouter ฟรี — Gemma 4 26B (native function calling; บางช่วง 429 rate-limit จาก Google upstream)
  - provider: openrouter
    model: google/gemma-4-26b-a4b-it:free
  # Nous Portal — โมเดลฟรี context 524K เหมาะงานยาว (ต้อง login: hermes auth add nous)
  - provider: nous
    model: upstage/solar-pro4:free
  # Nous Portal — reasoning + agentic (295B)
  - provider: nous
    model: tencent/hy3:free
  # Nous Portal — multimodal + reasoning
  - provider: nous
    model: stepfun/step-3.7-flash:free
  # Google AI Studio (Gemini) — fallback หลัง Nous (ต้องมี GEMINI_API_KEY ใน .env)
  - provider: gemini
    model: gemini-3.6-flash
  # ⚠️ ชั้น LM Studio ต่อเครื่อง — ปรับให้ตรงเครื่องตัวเอง:
  #    เครื่องทำงาน: ใช้ LM Studio ของตัวเอง → base_url: http://127.0.0.1:1234/v1 (qwen/qwen3.5-9b)
  #    เครื่องบ้าน:   ใช้ของเครื่องทำงานผ่าน Tailscale → http://100.77.88.33:1234/v1
  #                  + เครื่องนี้ (qwen/qwen3-1.7b @ 127.0.0.1) เป็นชั้นสุดท้าย
  # LM Studio (เครื่องทำงาน ผ่าน Tailscale) — ใช้ provider: custom (ระบุ base_url ตรง ๆ)
  - provider: custom
    model: qwen/qwen3.5-9b
    base_url: http://100.77.88.33:1234/v1
  # LM Studio (เครื่องนี้) — อันดับสุดท้าย (เสปคต่ำ)
  - provider: lmstudio
    model: qwen/qwen3-1.7b
    base_url: http://127.0.0.1:1234/v1

auxiliary:
  compression:
    # ใช้ OpenRouter ฟรี (context 1M) — ตัว local ตัวเล็ก (32K) ต่ำกว่าเกณฑ์ 64K ของ Hermes
    provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free

custom_providers:
  # ⚠️ ปรับให้ตรงเครื่องตัวเองด้วย (เครื่องทำงาน: มี LM Studio ของตัวเองที่ 127.0.0.1)
  # LM Studio (เครื่องทำงาน ผ่าน Tailscale) — qwen/qwen3.5-9b (context ตาม LM Studio, ตั้งเผื่อ 64K)
  - name: lmstudio-work
    base_url: http://100.77.88.33:1234/v1
    models:
      qwen/qwen3.5-9b:
        context_length: 65536
  # LM Studio (เครื่องนี้) — context_length ตามที่โหลดจริงใน LM Studio
  - name: lmstudio-local
    base_url: http://127.0.0.1:1234/v1
    models:
      qwen/qwen3-1.7b:
        context_length: 32768

terminal:
  backend: local
  home_mode: real
checkpoints:
  enabled: true
telegram:
  require_mention: true
  exclusive_bot_mentions: true
